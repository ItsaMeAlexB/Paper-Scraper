name: Weekly Digest Build
on:
  schedule:
    - cron: '15 4 * * 0'   # Sunday at 04:15 UTC
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - name: Run weekly build
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENTREZ_EMAIL: ${{ secrets.ENTREZ_EMAIL }}
          APIFY_API: ${{ secrets.APIFY_API }}
          DAILY_MODE: weekly
        run: python daily_digest.py
      - name: Commit and push queue file
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_queue.json last_sent_date.txt 2>/dev/null || true
          git commit -m "Update weekly queue [skip ci]" || echo "No changes"
          git push
